[tool.poetry]
name = "entitybase-import"
version = "0.1.0"
description = "Command-line tool for importing entities into Entitybase Backend using the API"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = ["Entitybase Team"]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
httpx = "^0.27.0"
pydantic = "^2.0"
requests = "^2.31.0"
python-dotenv = "^1.2.3"
fastapi = "^0.115.0"
uvicorn = "^0.34.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
ruff = "^0.15.10"
mypy = "^1.9.0"
types-requests = "^2.31.0"

[tool.poetry.scripts]
entitybase-import = "cli:main"

[tool.mypy]
explicit_package_bases = true
namespace_packages = true